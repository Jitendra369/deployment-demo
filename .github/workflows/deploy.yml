name: CI/CD - Build and Deploy to EC2

on:
  push:
    branches: [ main ]       # runs on every push to main
  workflow_dispatch:          # lets you run it manually from the Actions tab

env:
  IMAGE_NAME: jittu009/deployment-demo

jobs:
  # ---------- Job 1: build the JAR and the Docker image, push to Docker Hub ----------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ---------- Job 2: log in to EC2 and restart the app with the new image ----------
  deploy:
    needs: build-and-push      # only runs if job 1 succeeded
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2 over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/myapp-rds
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo "Waiting for app to start..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/api/test/ping; then
                echo ""
                echo "Deployment successful"
                exit 0
              fi
              sleep 3
            done
            echo "App did not start. Last logs:"
            docker compose logs app --tail 50
            exit 1